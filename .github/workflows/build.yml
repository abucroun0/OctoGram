name: Build OctoGram APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create API_KEYS file
        run: |
          cat > API_KEYS << EOF
          APP_ID=${{ secrets.TELEGRAM_APP_ID }}
          APP_HASH=${{ secrets.TELEGRAM_APP_HASH }}
          MAPS_V2_API=
          SIGNING_KEY_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OctoGram-release
          path: TMessagesProj/build/outputs/apk/**/*.apk
